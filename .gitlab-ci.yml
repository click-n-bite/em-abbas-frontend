stages:
  - test
  - build
  - deploy

default:
  interruptible: true

# On-demand only: pushes, MRs, and tags do not start a pipeline (saves free
# minutes). Start from CI/CD → Pipelines → Run pipeline, or via API/trigger.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: never

test:
  stage: test
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm
  before_script:
    - npm ci --cache .npm
  script:
    - npm run typecheck
    - node --test tests/channel-identity.test.mjs
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build-image:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  needs:
    - test
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.ssh_setup:
  image: alpine:3.21
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - |
      if [ "${ENV_FILE:-}" = ".env.test" ]; then
        SSH_PRIVATE_KEY="${TEST_SSH_PRIVATE_KEY:-}"
        SSH_PRIVATE_KEY_B64="${TEST_SSH_PRIVATE_KEY_B64:-}"
        key_hint="TEST_SSH_PRIVATE_KEY or TEST_SSH_PRIVATE_KEY_B64"
      elif [ "${ENV_FILE:-}" = ".env.production" ]; then
        SSH_PRIVATE_KEY="${PROD_SSH_PRIVATE_KEY:-}"
        SSH_PRIVATE_KEY_B64="${PROD_SSH_PRIVATE_KEY_B64:-}"
        key_hint="PROD_SSH_PRIVATE_KEY or PROD_SSH_PRIVATE_KEY_B64"
      else
        echo "ENV_FILE must be .env.test or .env.production"
        exit 1
      fi
      test -n "${SSH_PRIVATE_KEY_B64:-}${SSH_PRIVATE_KEY:-}" || { echo "Set $key_hint"; exit 1; }
      test -n "${SSH_KNOWN_HOSTS:-}" || { echo "SSH_KNOWN_HOSTS is required"; exit 1; }
      write_secret_file() {
        src="$1"
        dest="$2"
        mode="$3"
        if [ -f "$src" ]; then
          tr -d '\r' < "$src" > "$dest"
        else
          printf '%s\n' "$src" | tr -d '\r' > "$dest"
        fi
        chmod "$mode" "$dest"
      }
      rewrite_openssh_key() {
        dest="$1"
        raw=$(tr -d '\r' < "$dest")
        case "$raw" in
          *'BEGIN OPENSSH PRIVATE KEY'*) ;;
          *) return 1 ;;
        esac
        body=$(printf '%s\n' "$raw" | sed 's/-----BEGIN OPENSSH PRIVATE KEY-----//' | sed 's/-----END OPENSSH PRIVATE KEY-----//' | tr -d '\n \t')
        {
          printf '%s\n' '-----BEGIN OPENSSH PRIVATE KEY-----'
          printf '%s\n' "$body" | fold -w 70
          printf '%s\n' '-----END OPENSSH PRIVATE KEY-----'
        } > "$dest"
        chmod 600 "$dest"
      }
      if [ -n "${SSH_PRIVATE_KEY_B64:-}" ]; then
        if [ -f "$SSH_PRIVATE_KEY_B64" ]; then
          tr -d ' \t\r\n' < "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_deploy
        else
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/id_deploy
        fi
        chmod 600 ~/.ssh/id_deploy
      else
        write_secret_file "$SSH_PRIVATE_KEY" ~/.ssh/id_deploy 600
        ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1 || rewrite_openssh_key ~/.ssh/id_deploy
      fi
      write_secret_file "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts 644
      grep -qE 'ssh-(ed25519|rsa)|ecdsa-sha2' ~/.ssh/known_hosts \
        || { echo "SSH_KNOWN_HOSTS has no host keys (only comments). Use ssh-keyscan output, Type File."; exit 1; }
      ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1 \
        || { echo "SSH private key is invalid. Add $key_hint (File) or the matching *_B64 = output of: base64 -w0 <private-key>"; exit 1; }
      echo "Deploy key fingerprint:"
      ssh-keygen -l -f ~/.ssh/id_deploy
    - printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  BatchMode yes\n' > ~/.ssh/config

.deploy:
  extends: .ssh_setup
  stage: deploy
  needs:
    - build-image
  script:
    - test -n "${DEPLOY_HOST:-}" || { echo "DEPLOY_HOST is empty — set TEST_DEPLOY_HOST or PROD_DEPLOY_HOST"; exit 1; }
    - test -n "${DEPLOY_USER:-}" || { echo "DEPLOY_USER is empty"; exit 1; }
    - test -n "${DEPLOY_PATH:-}" || { echo "DEPLOY_PATH is empty"; exit 1; }
    - test -n "${REGISTRY_DEPLOY_USER:-}" || { echo "REGISTRY_DEPLOY_USER is required"; exit 1; }
    - test -n "${REGISTRY_DEPLOY_PASSWORD:-}" || { echo "REGISTRY_DEPLOY_PASSWORD is required"; exit 1; }
    - |
      if [ -n "${TEST_DEPLOY_HOST:-}" ] && [ -n "${PROD_DEPLOY_HOST:-}" ] \
        && [ "$TEST_DEPLOY_HOST" = "$PROD_DEPLOY_HOST" ] && [ "$ENV_FILE" = ".env.test" ]; then
        echo "TEST_DEPLOY_HOST equals PROD_DEPLOY_HOST. Point test at a different server."
        exit 1
      fi
    - |
      if ! ssh-keygen -F "$DEPLOY_HOST" >/dev/null 2>&1; then
        echo "SSH_KNOWN_HOSTS has no entry for $DEPLOY_HOST"
        echo "On a machine that can reach that server, run:"
        echo "  ssh-keyscan -H $DEPLOY_HOST"
        echo "Append the output to the GitLab File variable SSH_KNOWN_HOSTS (keep the other server's lines)."
        echo "The host string must match TEST_DEPLOY_HOST / PROD_DEPLOY_HOST exactly (IP vs hostname)."
        exit 1
      fi
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
    - scp docker-compose.prod.yml deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - printf '%s' "$REGISTRY_DEPLOY_PASSWORD" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login '$CI_REGISTRY' --username '$REGISTRY_DEPLOY_USER' --password-stdin"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && sh deploy.sh '$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA' docker-compose.prod.yml '$ENV_FILE'"

deploy-test:
  extends: .deploy
  resource_group: ema-portal-test
  environment:
    name: test
    url: $TEST_ENVIRONMENT_URL
  allow_failure: true
  variables:
    DEPLOY_HOST: $TEST_DEPLOY_HOST
    DEPLOY_USER: $TEST_DEPLOY_USER
    DEPLOY_PATH: $TEST_DEPLOY_PATH
    ENV_FILE: .env.test
  rules:
    - if: $TEST_DEPLOY_HOST == null || $TEST_DEPLOY_HOST == ""
      when: never
    - if: $CI_COMMIT_BRANCH
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual

deploy-production:
  extends: .deploy
  resource_group: ema-portal-production
  environment:
    name: production
    url: $PROD_ENVIRONMENT_URL
  allow_failure: true
  variables:
    DEPLOY_HOST: $PROD_DEPLOY_HOST
    DEPLOY_USER: $PROD_DEPLOY_USER
    DEPLOY_PATH: $PROD_DEPLOY_PATH
    ENV_FILE: .env.production
  rules:
    - if: $PROD_DEPLOY_HOST == null || $PROD_DEPLOY_HOST == ""
      when: never
    - if: $CI_COMMIT_BRANCH
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
